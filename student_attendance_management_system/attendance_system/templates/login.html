{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h2 class="fw-bold mb-3">Login to SAMS</h2>
          <p class="text-muted">Sign in to manage students and attendance.</p>
          <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="mb-3">
              <label class="form-label" for="id_username">Username</label>
              <input type="text" class="form-control" id="id_username" name="username" placeholder="Enter username" value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label" for="id_password">Password</label>
              <input type="password" class="form-control" id="id_password" name="password" placeholder="Enter password" autocomplete="current-password" required>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" name="remember_me" id="rememberMe">
              <label class="form-check-label" for="rememberMe">Remember me for 30 days</label>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
          </form>
          <p class="text-muted mt-3 mb-0">No account yet? <a href="{% url 'register' %}">Register here</a>.</p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
